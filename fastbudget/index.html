.tx{border-right:5px solid transparent}.tx.e{border-right-color:#f44336}.tx.i{border-right-color:#4caf50}.tx.t{border-right-color:#2196f3}
.mh{display:flex;justify-content:space-between;align-items:baseline;background:#eee;padding:10px 14px 6px;font-size:17px}

.fp{display:flex;justify-content:space-between;font-size:13px;color:var(--mut)}

.bars{display:flex;gap:4px;align-items:flex-end;height:110px;padding:0 4px}

.cl-g{display:grid;grid-template-columns:repeat(7,1fr);background:#fff;margin-top:10px}

.cl{height:66px;border:0;border-bottom:1px solid #e4e4e4;background:#fff;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0}

</style>

<body data-t="exp">
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="phc" accept="image/*" capture="environment" style="display:none"><input type="file" id="pha" accept="image/*" style="display:none"><input type="file" id="file" accept=".json,application/json" style="display:none">
<script>
'use strict';
/* ===== utilità ===== */
const $=s=>document.querySelector(s);
const WD=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];
const WD3=['dom','lun','mar','mer','gio','ven','sab'];
const MN=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const P=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return iso(d)};
const cap=s=>s?s[0].toUpperCase()+s.slice(1):s;
const dl=s=>{const d=P(s);return WD[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()]+(d.getFullYear()!==new Date().getFullYear()?' '+d.getFullYear():'')};
const dshort=s=>{const d=P(s);return WD3[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()].slice(0,3)};
const dnum=s=>{const d=P(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+String(d.getFullYear()).slice(2)};
const eur=n=>((Math.round(n*100)/100)||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
function parseAmt(s){s=String(s==null?'':s).trim();if(!s)return 0;if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isNaN(n)?0:n}
const numStr=n=>String(n).replace('.',',');
const PAL=['#e53935','#fb8c00','#fdd835','#43a047','#00acc1','#1e88e5','#5e35b1','#d81b60','#6d4c41','#546e7a'];
const EMO=['🏥','🛒','🍽️','☕','⛵','👕','🛠️','⛽','🎁','🧾','💡','💧','🔥','☎️','📖','🏠','☂️','🎮','🤝','🏛️','🧹','💼','🚗','✈️','🐶','💊','🎓','👶','💻','🎬','🏋️','💰'];
const FREQ={'0':'Una volta','w':'Ogni settimana','1':'Ogni mese','2':'Ogni 2 mesi','3':'Ogni 3 mesi','6':'Ogni 6 mesi','12':'Ogni anno'};

/* ===== dati ===== */
const KEY='fastbudget.v1';
let S;
function load(){try{const j=localStorage.getItem(KEY);if(j)return JSON.parse(j)}catch(e){}return null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Impossibile salvare i dati')}}
function seed(){
  const ex=[['Salute','🏥',1],['Supermercato','🛒',1],['Ristorante','🍽️',1],['Da asporto','☕',1],['Barca','⛵'],['Abbigliamento','👕'],['Manutenzioni','🛠️'],['Trasporti','⛽',1],['Acquisti generici/regali','🎁',1],['Varie','🧾',1],['Luce','💡'],['Acqua','💧'],['Gas','🔥'],['Telefonia','☎️'],['Scuola','📖'],['Mutui','🏠'],['Assicurazioni','☂️'],['Abbonamenti vari','🎮'],['Associazioni','🤝'],['Tasse','🏛️'],['Pulizie','🧹']];
  const inc=[['Stipendio','💼'],['Affitti','🏠'],['Varie','🧾']];
  const cats=[];
  ex.forEach((c,i)=>cats.push({id:uid(),name:c[0],icon:c[1],color:PAL[i%PAL.length],type:'exp',subs:[],fav:!!c[2]}));
  inc.forEach((c,i)=>cats.push({id:uid(),name:c[0],icon:c[1],color:PAL[(i+3)%PAL.length],type:'inc',subs:[],fav:true}));
  return {v:1,accounts:[{id:uid(),name:'Contanti',open:0,arch:false,hide:false}],cards:[],cats,tx:[],rec:[],last:{}};
}
const cat=id=>S.cats.find(c=>c.id===id);
const acc=id=>S.accounts.find(a=>a.id===id)||S.cards.find(c=>c.id===id);
const isCard=id=>S.cards.some(c=>c.id===id);

/* ===== calcoli ===== */
function balance(a){let b=a.open||0;for(const t of S.tx){if(t.type==='trf'){if(t.acc===a.id)b-=t.amt;if(t.to===a.id)b+=t.amt}else if(t.acc===a.id)b+=t.type==='inc'?t.amt:-t.amt}return b}
function dovuto(c){let d=0;for(const t of S.tx){if(t.type==='trf'){if(t.to===c.id)d-=t.amt;if(t.acc===c.id)d+=t.amt}else if(t.acc===c.id)d+=t.type==='exp'?t.amt:-t.amt}return d}
function cycle(c){const t=P(today());const sd=(y,m)=>new Date(y,m,Math.min(c.start||1,new Date(y,m+1,0).getDate()));let s=sd(t.getFullYear(),t.getMonth());if(s>t)s=sd(t.getFullYear(),t.getMonth()-1);const nx=sd(s.getFullYear(),s.getMonth()+1);const e=new Date(nx);e.setDate(e.getDate()-1);return [iso(s),iso(e)]}
function cycleSpent(c){const [a,b]=cycle(c);let s=0;for(const t of S.tx){if(t.acc===c.id&&t.type!=='trf'&&t.date>=a&&t.date<=b)s+=t.type==='exp'?t.amt:-t.amt}return s}
function occs(r,until){
  const out=[];const s=P(r.start);const endS=r.end&&r.end<until?r.end:until;
  if(r.freq==='w'){const d=new Date(s);while(iso(d)<=endS){out.push(iso(d));d.setDate(d.getDate()+7);if(out.length>2000)break}return out}
  const n=+r.freq||1;
  for(let i=0;i<800;i++){const m=s.getMonth()+i*n;const y=s.getFullYear();const last=new Date(y,m+1,0).getDate();const x=iso(new Date(y,m,Math.min(r.day,last)));if(x>endS)break;if(x>=r.start)out.push(x)}
  return out;
}
function materialize(){
  let ch=false;const td=today();const have=new Set(S.tx.filter(t=>t.recId).map(t=>t.recId+'|'+t.date));
  for(const r of S.rec){if(r.paused)continue;for(const d of occs(r,td)){if(r.after&&d<=r.after)continue;if((r.skip||[]).includes(d))continue;const k=r.id+'|'+d;if(have.has(k))continue;S.tx.push({id:uid(),ts:Date.now(),date:d,type:r.type,amt:r.amt,cat:r.cat,sub:r.sub,acc:r.acc,note:r.note,payee:r.payee||'',refund:!!r.refund,recId:r.id});have.add(k);ch=true}}
  if(ch)save();
}
function nextOcc(r){const td=today();const far=iso(new Date(new Date().getFullYear()+3,0,1));return occs(r,far).find(d=>d>td&&(!r.after||d>r.after))||null}
function perMonth(r){return r.freq==='w'?r.amt*52/12:r.amt/(+r.freq)}

function movList(list){
  list=list.slice().sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
  const td=today();let h='',cur='',buf=[];
  const flush=()=>{if(!cur)return;let tot=0;buf.forEach(t=>{if(t.type==='exp')tot-=t.amt;else if(t.type==='inc')tot+=t.amt});h+='<div class="day"><span>'+esc(cap(dl(cur)))+(cur===td?' · oggi':'')+'</span><span>'+(tot?eur(tot):'')+'</span></div>'+buf.map(txRow).join('')};

function vReport(){
  const [y,m]=mon.split('-').map(Number);const t=rmode;
  const tot={};let sum=0;
  S.tx.filter(x=>x.date.startsWith(mon)&&x.type!=='trf').forEach(x=>{let v=0;if(t==='exp'){if(x.type==='exp')v=x.amt;else if(x.refund)v=-x.amt}else if(x.type==='inc'&&!x.refund)v=x.amt;if(!v)return;const k=x.cat||'-';tot[k]=(tot[k]||0)+v;sum+=v});
  const rows=Object.entries(tot).sort((a,b)=>b[1]-a[1]);
  let h='<div class="bar2"><button data-a="mm" data-d="-1">‹</button><div class="m">'+cap(MN[m-1])+' '+y+'</div><button data-a="mm" data-d="1">›</button></div>';
  h+='<div class="seg" style="margin:10px 12px;background:#ddd"><button class="'+(t==='exp'?'on':'')+'" style="color:#333" data-a="rm" data-v="exp">Spese</button><button class="'+(t==='inc'?'on':'')+'" style="color:#333" data-a="rm" data-v="inc">Entrate</button></div>';
  h+='<div class="card"><div style="font-size:13px;color:var(--mut)">Totale</div><div style="font-size:28px;font-weight:600">'+eur(sum)+'</div></div>';
  h+='<div class="card">'+(rows.length?rows.map(([k,v])=>{const c=cat(k);return '<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;gap:8px"><span>'+(c?c.icon+' '+esc(c.name):'Senza categoria')+'</span><b>'+eur(v)+' <small class="mut">'+Math.round(v/sum*100)+'%</small></b></div><div class="bar-w"><i style="width:'+Math.max(2,v/rows[0][1]*100)+'%;background:'+(c?c.color:'#999')+'"></i></div></div>'}).join(''):'<div class="empty">Nessun dato.</div>')+'</div>';
  const ms=[];for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1);ms.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  const vals=ms.map(k=>{let e=0,n=0;S.tx.filter(x=>x.date.startsWith(k)).forEach(x=>{if(x.type==='exp')e+=x.amt;else if(x.type==='inc'){if(x.refund)e-=x.amt;else n+=x.amt}});return [k,e,n]});

  const yv=[];for(let i=12;i>=1;i--){const k=y+'-'+pad(i);const [n,e]=monthTot(k);if(n||e)yv.push([i,n,e])}
  h+=yv.map(v=>'<div class="card"><b>'+cap(MN[v[0]-1])+' '+y+'</b><div style="display:flex;gap:16px;align-items:center;margin-top:6px">'+donut(v[1],v[2])+'<div style="flex:1"><div class="kv">Entrate:<span class="pos">'+eur(v[1])+'</span></div><div class="kv">Uscite:<span class="neg">'+eur(-v[2])+'</span></div><div class="kv">Totale:<span class="'+(v[1]-v[2]<0?'neg':'pos')+'">'+eur(v[1]-v[2])+'</span></div></div></div></div>').join('');

function csList(){

A.edit=d=>{const t=S.tx.find(x=>x.id===d.id);if(!t)return;
  if(t.type==='trf'){sheet('<div class="shh"><span>Trasferimento</span></div><div class="shb"><div class="fld"><b>'+eur(t.amt)+'</b><br>'+esc(accName(t.acc))+' → '+esc(accName(t.to))+'<br><span class="mut">'+esc(cap(dl(t.date)))+'</span></div></div><div class="shf"><button class="btn sec" data-a="x">Chiudi</button><button class="btn dng" data-a="deltx" data-id="'+t.id+'">Elimina</button></div>');return}
  E={type:t.type,amt:numStr(t.amt),cat:t.cat,sub:t.sub||null,date:t.date,acc:t.acc,note:t.note||'',payee:t.payee||'',rec:'0',refund:!!t.refund,editId:t.id,photo:t.photo||null,origPhoto:t.photo||null};tab='add';sub=null;render()};
A.del=()=>{if(!E.editId)return;if(!confirm('Eliminare questo movimento?'))return;delTx(E.editId);E=newE();tab='mov';render()};
A.deltx=d=>{if(!confirm('Eliminare?'))return;delTx(d.id);closeSheet();render()};
function delTx(id){const t=S.tx.find(x=>x.id===id);if(!t)return;if(t.photo)PDB.del(t.photo);if(t.recId){const r=S.rec.find(x=>x.id===t.recId);if(r){r.skip=r.skip||[];r.skip.push(t.date)}}S.tx=S.tx.filter(x=>x.id!==id);save()}
A.mm=d=>{let [y,m]=mon.split('-').map(Number);m+=+d.d;if(m<1){m=12;y--}if(m>12){m=1;y++}mon=y+'-'+pad(m);render()};
A.ms=d=>{mseg=d.v;render()};
A.cs=d=>{csel=d.v;if(!d.v.startsWith(mon))mon=d.v.slice(0,7);render()};
A.addday=()=>{E=newE('exp');E.date=csel;tab='add';sub=null;render()};
A.fs=d=>{fseg=d.v;render()};
A.yy=d=>{yr+=+d.d;render()};
A.rm=d=>{rmode=d.v;render()};
A.report=()=>{sub='report';render()};
A.cats=()=>{sub='cats';render()};
/* fisse */
A.newfix=()=>{E=newE('exp');E.rec='1';tab='add';sub=null;render()};
A.re=d=>{const r=S.rec.find(x=>x.id===d.id);if(!r)return;RE=JSON.parse(JSON.stringify(r));RE.amt=numStr(r.amt);drawRE()};
function drawRE(){
  const c=cat(RE.cat);
  sheet('<div class="shh"><span>Spesa fissa</span></div><div class="shb"><div class="fld"><label>Importo (vale dalle prossime scadenze)</label><input data-in="re.amt" inputmode="decimal" value="'+esc(RE.amt)+'"></div>'
  +'<div class="fld"><label>Categoria</label><button class="chip" style="width:100%;text-align:left" data-a="recat">'+(c?c.icon+' ':'')+esc(catName(RE))+'</button></div>'
  +'<div class="fld"><label>Frequenza</label><select data-in="re.freq">'+Object.keys(FREQ).filter(k=>k!=='0').map(k=>'<option value="'+k+'"'+(RE.freq===k?' selected':'')+'>'+FREQ[k]+'</option>').join('')+'</select></div>'
  +'<div class="fld"><label>Data (giorno di scadenza)</label><button class="chip date" style="width:100%;text-align:left" data-a="restart">📅 '+esc(cap(dl(RE.start)))+'</button></div>'
  +'<div class="fld"><label>Termina il</label><button class="chip" style="width:100%;text-align:left" data-a="reend">'+(RE.end?'📅 '+esc(cap(dl(RE.end))):'Mai')+'</button></div>'
  +'<div class="fld"><label>Conto / carta</label><select data-in="re.acc">'+accList().map(a=>'<option value="'+a.id+'"'+(RE.acc===a.id?' selected':'')+'>'+esc(a.name)+'</option>').join('')+'</select></div>'
  +'<div class="fld"><label>Nota</label><input data-in="re.note" value="'+esc(RE.note||'')+'"></div>'
  +'<button class="sw" data-a="repause" style="width:calc(100% - 32px)"><span>In pausa</span><span class="tg'+(RE.paused?' on':'')+'"></span></button></div>'
  +'<div class="shf"><button class="btn dng" data-a="redel">Elimina</button><button class="btn sec" data-a="x">Annulla</button><button class="btn" data-a="resave">Salva</button></div>');
}
A.recat=()=>catSheet(RE.type,(c,s)=>{RE.cat=c;RE.sub=s;drawRE()});
A.restart=()=>pickDate(RE.start,v=>{RE.start=v;RE.day=P(v).getDate();drawRE()});
A.reend=()=>pickDate(RE.end||today(),v=>{RE.end=v||null;drawRE()},true);
A.repause=()=>{RE.paused=!RE.paused;drawRE()};
A.redel=()=>{if(!confirm('Eliminare la spesa fissa? I movimenti già registrati restano.'))return;S.rec=S.rec.filter(r=>r.id!==RE.id);save();closeSheet();render()};
A.resave=()=>{const r=S.rec.find(x=>x.id===RE.id);if(!r)return;const amt=parseAmt(RE.amt);if(!(amt>0)){toast('Importo non valido');return}
  const sch=r.freq!==RE.freq||r.start!==RE.start;
  Object.assign(r,{amt,cat:RE.cat,sub:RE.sub,freq:RE.freq,start:RE.start,day:P(RE.start).getDate(),end:RE.end,acc:RE.acc,note:RE.note,paused:RE.paused});
  if(sch)r.after=today();
  save();materialize();closeSheet();toast('Fissa aggiornata ✓');render()};
/* conti */
A.arch=()=>{showArch=!showArch;render()};
A.hide=d=>{const a=acc(d.id);a.hide=!a.hide;save();render()};
A.chide=d=>{const a=acc(d.id);a.hide=!a.hide;save();toast(a.hide?'Carta nascosta dai totali':'Carta visibile')};
A.newacc=()=>{AE={id:null,name:'',open:''};drawAE(false)};
A.newcard=()=>{AE={id:null,name:'',limit:'',start:'1'};drawAE(true)};
function drawAE(card){
  sheet('<div class="shh"><span>'+(AE.id?'Modifica':'Nuov'+(card?'a carta':'o conto'))+'</span></div><div class="shb"><div class="fld"><label>Nome</label><input data-in="ae.name" value="'+esc(AE.name)+'" placeholder="'+(card?'Es. Visa':'Es. Conto corrente')+'"></div>'+(card?'<div class="fld"><label>Limite (€)</label><input data-in="ae.limit" inputmode="decimal" value="'+esc(AE.limit)+'"></div><div class="fld"><label>Il ciclo inizia il giorno (1-31)</label><input data-in="ae.start" inputmode="numeric" value="'+esc(AE.start)+'"></div>':'<div class="fld"><label>Saldo iniziale (€)</label><input data-in="ae.open" inputmode="decimal" value="'+esc(AE.open)+'"></div>')+'</div><div class="shf"><button class="btn sec" data-a="x">Annulla</button><button class="btn" data-a="aesave" data-card="'+(card?1:0)+'">Salva</button></div>');
}
A.aesave=d=>{if(!AE.name.trim()){toast('Inserisci un nome');return}let nid=null;
  if(d.card==='1'){const o={name:AE.name.trim(),limit:parseAmt(AE.limit),start:Math.min(31,Math.max(1,parseInt(AE.start)||1))};if(AE.id)Object.assign(S.cards.find(c=>c.id===AE.id),o);else S.cards.push({id:(nid=uid()),hide:false,...o})}
  else{const o={name:AE.name.trim(),open:parseAmt(AE.open)};if(AE.id)Object.assign(S.accounts.find(c=>c.id===AE.id),o);else S.accounts.push({id:(nid=uid()),arch:false,hide:false,...o})}
  if(nid&&tab==='add'&&!sub)E.acc=nid;
  save();closeSheet();render()};
A.am=d=>{const a=acc(d.id);sheet('<div class="shh"><span>'+esc(a.name)+'</span></div><div class="shb"><button class="opt" data-a="aedit" data-id="'+a.id+'">✏️ Modifica nome / saldo iniziale</button><button class="opt" data-a="aarch" data-id="'+a.id+'">'+(a.arch?'📤 Ripristina':'📦 Archivia')+'</button><button class="opt" data-a="adel" data-id="'+a.id+'" style="color:#c62828">🗑 Elimina</button></div><div class="shf"><button class="btn sec" data-a="x">Chiudi</button></div>')};
A.aedit=d=>{const a=acc(d.id);AE={id:a.id,name:a.name,open:numStr(a.open||0)};drawAE(false)};
A.aarch=d=>{const a=acc(d.id);a.arch=!a.arch;save();closeSheet();render()};
A.adel=d=>{const used=S.tx.some(t=>t.acc===d.id||t.to===d.id);if(used&&!confirm('Ci sono movimenti su questo conto: verranno eliminati. Meglio archiviarlo. Eliminare comunque?'))return;if(!used&&!confirm('Eliminare il conto?'))return;S.accounts=S.accounts.filter(a=>a.id!==d.id);S.tx=S.tx.filter(t=>t.acc!==d.id&&t.to!==d.id);S.rec=S.rec.filter(r=>r.acc!==d.id);save();closeSheet();render()};
/* carte: menu con azione 'cmenu' (cm = calendario) */
A.cmenu=d=>{const a=acc(d.id);sheet('<div class="shh"><span>'+esc(a.name)+'</span></div><div class="shb"><button class="opt" data-a="cedit" data-id="'+a.id+'">✏️ Modifica</button><button class="opt" data-a="cdel" data-id="'+a.id+'" style="color:#c62828">🗑 Elimina</button></div><div class="shf"><button class="btn sec" data-a="x">Chiudi</button></div>')};
A.cedit=d=>{const a=acc(d.id);AE={id:a.id,name:a.name,limit:numStr(a.limit||0),start:String(a.start||1)};drawAE(true)};
A.cdel=d=>{if(!confirm('Eliminare la carta e i suoi movimenti?'))return;S.cards=S.cards.filter(c=>c.id!==d.id);S.tx=S.tx.filter(t=>t.acc!==d.id&&t.to!==d.id);S.rec=S.rec.filter(r=>r.acc!==d.id);save();closeSheet();render()};
A.cadd=d=>{E=newE('exp');E.acc=d.id;tab='add';render()};
A.cpay=d=>{const c=acc(d.id);const from=(S.accounts.find(a=>!a.arch)||{}).id;TS={from,to:c.id,amt:numStr(Math.max(0,dovuto(c))),date:today()};drawTS('Paga carta')};
A.trf=d=>{const to=(S.accounts.find(a=>!a.arch&&a.id!==d.id)||{}).id;TS={from:d.id,to,amt:'',date:today()};drawTS('Trasferimento')};
function drawTS(title){
  const opts=sel=>accList().map(a=>'<option value="'+a.id+'"'+(sel===a.id?' selected':'')+'>'+esc(a.name)+'</option>').join('');
  sheet('<div class="shh"><span>'+title+'</span></div><div class="shb"><div class="fld"><label>Da</label><select data-in="ts.from">'+opts(TS.from)+'</select></div><div class="fld"><label>A</label><select data-in="ts.to">'+opts(TS.to)+'</select></div><div class="fld"><label>Importo (€)</label><input data-in="ts.amt" inputmode="decimal" value="'+esc(TS.amt)+'"></div><div class="fld"><label>Data</label><button class="chip date" style="width:100%;text-align:left" data-a="tsdate">📅 '+esc(cap(dl(TS.date)))+'</button></div></div><div class="shf"><button class="btn sec" data-a="x">Annulla</button><button class="btn" data-a="tssave">Conferma</button></div>');
}
A.tsdate=()=>pickDate(TS.date,v=>{TS.date=v;drawTS('Trasferimento')});
A.tssave=()=>{const amt=parseAmt(TS.amt);if(!(amt>0)||!TS.from||!TS.to||TS.from===TS.to){toast('Controlla conti e importo');return}S.tx.push({id:uid(),ts:Date.now(),date:TS.date,type:'trf',amt,acc:TS.from,to:TS.to});save();closeSheet();toast('Registrato ✓');render()};
/* categorie */
A.cspick=d=>{const cb=CS.cb;cb(d.id,d.s||null)};
A.csopen=d=>{CS.open[d.id]=!CS.open[d.id];$('#cslist').innerHTML=csList()};
A.cssearch=()=>{CS.search=!CS.search;CS.q='';drawCS()};
A.csfav=()=>{CS.fav=!CS.fav;drawCS()};
A.csman=()=>{closeSheet();sub='cats';rmode=CS.type;render()};
A.cfav=d=>{const c=cat(d.id);c.fav=!c.fav;save();render()};
A.cnew=()=>{CE={id:null,name:'',icon:'🧾',color:PAL[S.cats.length%PAL.length],type:rmode,subs:[]};drawCE()};
A.ce=d=>{const c=cat(d.id);CE=JSON.parse(JSON.stringify(c));drawCE()};
function drawCE(){
  sheet('<div class="shh"><span>'+(CE.id?'Modifica categoria':'Nuova categoria')+'</span></div><div class="shb"><div class="fld"><label>Nome</label><input data-in="ce.name" value="'+esc(CE.name)+'"></div><div class="fld"><label>Icona (emoji)</label><input data-in="ce.icon" value="'+esc(CE.icon)+'" style="font-size:22px"><div class="emo">'+EMO.map(e=>'<button data-a="ceicon" data-v="'+e+'" class="'+(CE.icon===e?'on':'')+'">'+e+'</button>').join('')+'</div></div><div class="fld"><label>Colore</label><div class="emo">'+PAL.map(c=>'<button class="col'+(CE.color===c?' on':'')+'" data-a="cecol" data-v="'+c+'" style="background:'+c+'"></button>').join('')+'</div></div><div class="fld"><label>Sottocategorie</label>'+CE.subs.map((s,i)=>'<div class="subrow"><input value="'+esc(s.name)+'" oninput="CE.subs['+i+'].name=this.value"><button data-a="cesubdel" data-i="'+i+'">✕</button></div>').join('')+'<button class="chip" data-a="cesubadd">＋ Aggiungi sottocategoria</button></div></div><div class="shf">'+(CE.id?'<button class="btn dng" data-a="cedel">Elimina</button>':'')+'<button class="btn sec" data-a="x">Annulla</button><button class="btn" data-a="cesave">Salva</button></div>');
}
A.ceicon=d=>{CE.icon=d.v;drawCE()};A.cecol=d=>{CE.color=d.v;drawCE()};
A.cesubadd=()=>{CE.subs.push({id:uid(),name:''});drawCE();const i=document.querySelectorAll('.subrow input');if(i.length)i[i.length-1].focus()};
A.cesubdel=d=>{CE.subs.splice(+d.i,1);drawCE()};
A.cesave=()=>{if(!CE.name.trim()){toast('Inserisci un nome');return}CE.subs=CE.subs.filter(s=>s.name.trim());CE.name=CE.name.trim();if(CE.id){Object.assign(cat(CE.id),{name:CE.name,icon:CE.icon,color:CE.color,subs:CE.subs})}else S.cats.push({id:uid(),name:CE.name,icon:CE.icon||'•',color:CE.color,type:CE.type,subs:CE.subs,fav:false});save();closeSheet();render()};
A.cedel=()=>{const n=S.tx.filter(t=>t.cat===CE.id).length;if(!confirm('Eliminare la categoria'+(n?' ('+n+' movimenti diventeranno “Senza categoria”)':'')+'?'))return;S.cats=S.cats.filter(c=>c.id!==CE.id);save();closeSheet();render()};
/* backup / import / csv */
A.bk=async()=>{const name='fastbudget-backup-'+today()+'.json';const blob=new Blob([JSON.stringify({app:'fastbudget',v:1,data:S})],{type:'application/json'});const f=new File([blob],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  dl2(blob,name)};
function dl2(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500)}
A.csv=()=>{const rows=[['Data','Giorno','Tipo','Importo','Categoria','Conto','A','Nota','Fissa']];S.tx.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,WD[P(t.date).getDay()],t.type==='exp'?'Spesa':t.type==='inc'?(t.refund?'Rimborso':'Incasso'):'Trasferimento',numStr(t.amt),t.type==='trf'?'':catName(t),accName(t.acc),t.to?accName(t.to):'',t.note||'',t.recId?'sì':'']));
  const csv='﻿'+rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(';')).join('\n');dl2(new Blob([csv],{type:'text/csv'}),'fastbudget-movimenti-'+today()+'.csv')};
A.imp=()=>$('#file').click();
$('#file').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;let j;try{j=JSON.parse(await f.text())}catch(x){toast('File non valido');return}
  if(j.app==='fastbudget'&&j.data&&j.data.tx){if(!confirm('Sostituire TUTTI i dati attuali con il backup?'))return;S=j.data;save();materialize();E=newE();render();toast('Backup ripristinato ✓');return}
  if(j.app==='fastbudget-setup'){let n=0;
    if(j.replace&&!S.tx.length&&!S.rec.length){S.accounts=[];S.cards=[];S.cats=[]}
    (j.accounts||[]).forEach(a=>{if(!S.accounts.some(x=>x.name.toLowerCase()===a.name.toLowerCase())){S.accounts.push({id:uid(),name:a.name,open:+a.open||0,arch:!!a.arch,hide:false});n++}});
    (j.cards||[]).forEach(c=>{if(!S.cards.some(x=>x.name.toLowerCase()===c.name.toLowerCase())){S.cards.push({id:uid(),name:c.name,limit:+c.limit||0,start:+c.start||1,hide:false});n++}});
    (j.cats||[]).forEach((c,i)=>{const ex=S.cats.find(x=>x.type===c.type&&x.name.toLowerCase()===c.name.toLowerCase());if(ex){(c.subs||[]).forEach(s=>{if(!ex.subs.some(y=>y.name===s))ex.subs.push({id:uid(),name:s})});if(c.fav)ex.fav=true}else{S.cats.push({id:uid(),name:c.name,icon:c.icon||'•',color:c.color||PAL[i%PAL.length],type:c.type,subs:(c.subs||[]).map(s=>({id:uid(),name:s})),fav:!!c.fav});n++}});
    let nr=0;(j.rec||[]).forEach(r=>{const ty=r.type||'exp';const c=S.cats.find(x=>x.type===ty&&x.name.toLowerCase()===String(r.cat||'').toLowerCase());const a=S.accounts.concat(S.cards).find(x=>x.name.toLowerCase()===String(r.acc||'').toLowerCase());if(!c||!a||!r.start)return;
      if(S.rec.some(x=>x.cat===c.id&&x.acc===a.id&&x.amt===+r.amt&&(x.note||'')===(r.note||'')))return;
      S.rec.push({id:uid(),type:ty,amt:+r.amt,cat:c.id,sub:null,acc:a.id,note:r.note||'',payee:'',freq:String(r.freq),start:r.start,day:+r.start.slice(8),end:null,after:today(),skip:[],paused:false});n++;nr++});
    save();E=newE();render();toast('Importati '+n+' elementi, di cui '+nr+' spese fisse ✓');return}
  toast('Formato non riconosciuto')});

/* ===== foto scontrini (IndexedDB) ===== */
const PDB={db:null,open(){return new Promise((res,rej)=>{const r=indexedDB.open('fastbudget-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async h(){return this.db||(this.db=await this.open())},
  async put(id,b){const db=await this.h();return new Promise((res,rej)=>{const t=db.transaction('p','readwrite');t.objectStore('p').put(b,id);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async get(id){const db=await this.h();return new Promise((res,rej)=>{const r=db.transaction('p').objectStore('p').get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async del(id){try{const db=await this.h();db.transaction('p','readwrite').objectStore('p').delete(id)}catch(e){}}};
async function compress(f){const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return new Promise(r=>c.toBlob(r,'image/jpeg',0.75))}
async function loadThumb(){const im=$('#ph');if(!im||!E.photo)return;try{const b=await PDB.get(E.photo);if(b)im.src=URL.createObjectURL(b)}catch(e){}}
for(const fid of ['phc','pha'])$('#'+fid).addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{toast('Salvo la foto…');const b=await compress(f);const id=uid();await PDB.put(id,b);if(E.photo&&E.photo!==E.origPhoto)PDB.del(E.photo);E.photo=id;render();toast('Foto allegata ✓')}catch(x){toast('Foto non salvata')}});
A.phcam=()=>$('#phc').click();
A.phatt=()=>$('#pha').click();
A.phdel=()=>{if(E.photo&&E.photo!==E.origPhoto)PDB.del(E.photo);E.photo=null;render()};
A.phview=async()=>{if(!E.photo)return;const b=await PDB.get(E.photo);if(!b){toast('Foto non trovata');return}const u=URL.createObjectURL(b);sheet('<div class="shh"><span>Scontrino</span></div><div class="shb" style="background:#111"><img src="'+u+'" style="width:100%;display:block"></div><div class="shf"><button class="btn sec" data-a="x">Chiudi</button></div>','full')};

const APP_V='6';
A.upd=async()=>{try{const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()};
/* ===== avvio ===== */
S=load()||seed();
if(!S.last)S.last={};
materialize();
E=newE();
render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=S.tx.length;materialize();if(S.tx.length!==n)render()}});
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
